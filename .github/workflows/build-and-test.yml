name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-api:
    runs-on: ubuntu-latest
    name: Test API Module
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: insurance_db
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Run API Tests
        working-directory: create-api
        run: ./mvnw clean test -X
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/insurance_db
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
      
      - name: Upload API Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: api-test-results
          path: create-api/target/surefire-reports/

  test-batch:
    runs-on: ubuntu-latest
    name: Test Batch Module
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Run Batch Tests
        working-directory: create-batch
        run: ./mvnw clean test
      
      - name: Upload Batch Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: batch-test-results
          path: create-batch/target/surefire-reports/

  test-web:
    runs-on: ubuntu-latest
    name: Test Web Module
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: create-web/package-lock.json
      
      - name: Install Dependencies
        working-directory: create-web
        run: npm ci
      
      - name: Build Web App
        working-directory: create-web
        run: npm run build
      
      - name: Run Security Audit
        working-directory: create-web
        run: npm audit --audit-level=high
      
      - name: Upload Web Build Output
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: web-build-output
          path: create-web/dist/

  integration-test:
    needs: [test-api, test-batch, test-web]
    runs-on: ubuntu-latest
    name: Integration Tests
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: insurance_db
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Run Integration Tests
        working-directory: create-api
        run: ./mvnw clean verify -DskipUnitTests
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/insurance_db
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
      
      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-results
          path: create-api/target/failsafe-reports/