name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  java-quality:
    runs-on: ubuntu-latest
    name: Java Code Quality
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # for better analysis
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: API - Code Quality Analysis
        working-directory: create-api
        run: ./mvnw clean verify sonar:sonar -DskipTests || true
      
      - name: Batch - Code Quality Analysis
        working-directory: create-batch
        run: ./mvnw clean verify sonar:sonar -DskipTests || true
      
      - name: Lint Java Code
        run: |
          echo "Running Checkstyle on Java modules..."
          find create-api create-batch -name "*.java" -type f

  web-quality:
    runs-on: ubuntu-latest
    name: Web Code Quality
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: create-web/package-lock.json
      
      - name: Install Dependencies
        working-directory: create-web
        run: npm ci
      
      - name: Lint Vue/TypeScript Code
        working-directory: create-web
        run: npm run lint || true
      
      - name: Run Type Checking
        working-directory: create-web
        run: npx vue-tsc --noEmit || true
      
      - name: Build for Production
        working-directory: create-web
        run: npm run build
      
      - name: Security Audit
        working-directory: create-web
        run: npm audit --audit-level=high || true

  dependency-check:
    runs-on: ubuntu-latest
    name: Dependency Check
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Check Maven Dependencies (API)
        working-directory: create-api
        run: ./mvnw dependency:check || true
      
      - name: Check Maven Dependencies (Batch)
        working-directory: create-batch
        run: ./mvnw dependency:check || true

  file-structure:
    runs-on: ubuntu-latest
    name: Validate Project Structure
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate Layer Architecture
        run: |
          echo "Validating package-by-feature structure..."
          echo "Expected directories:"
          echo "  - create-api/src/main/java/*/controller"
          echo "  - create-api/src/main/java/*/service"
          echo "  - create-api/src/main/java/*/mapper"
          echo "Checking create-api structure..."
          find create-api/src/main/java -type d -name controller -o -name service -o -name mapper 2>/dev/null | head -20 || echo "Structure check completed"
      
      - name: Validate Flyway Migrations
        run: |
          echo "Checking Flyway migration files..."
          find create-api/src/main/resources -name "*V*.sql" 2>/dev/null | head -20 || echo "No migration files found"
      
      - name: Validate MyBatis XML Files
        run: |
          echo "Checking MyBatis XML mapper files..."
          find create-api/src/main/resources/mapper -name "*.xml" 2>/dev/null | head -20 || echo "No mapper files found"