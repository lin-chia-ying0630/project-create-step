openapi: 3.1.0
info:
  title: 保險系統 API
  version: 0.1.0
  description: 新契約、客戶、首期保費、新契約批次承保作業、承保撤回與 Maker-Checker 覆核 API。
paths:
  /api/v1/reviews:
    get:
      summary: 分頁查詢覆核案件
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [PENDING, APPROVED, REJECTED], default: PENDING}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: 覆核案件查詢成功}
  /api/v1/reviews/{reviewId}:
    get:
      summary: 查詢覆核案件與加密 payload 解密後明細
      parameters:
        - {name: reviewId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 覆核明細查詢成功}
        '404': {description: 查無覆核案件}
  /api/v1/reviews/{reviewId}/approve:
    post:
      summary: 核准覆核案件並於同一交易套用正式異動
      parameters:
        - {name: reviewId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 覆核核准完成}
        '409': {description: 案件已處理}
        '422': {description: 建立人不得覆核自己的案件}
  /api/v1/reviews/{reviewId}/reject:
    post:
      summary: 退回覆核案件並釋放待審鎖
      parameters:
        - {name: reviewId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 覆核退回完成}
  /api/postal-codes/{postalCode}:
    get:
      summary: 依 3 或 6 碼郵遞區號查詢 POS 代碼定義中的縣市與行政區
      parameters:
        - {name: postalCode, in: path, required: true, schema: {type: string, pattern: '^[0-9]{3}([0-9]{3})?$'}}
      responses:
        '200': {description: 郵遞區號查詢成功}
        '400': {description: 郵遞區號格式錯誤}
        '404': {description: 查無郵遞區號前三碼}
  /api/v1/customers:
    post:
      summary: 送出自然人或公司行號客戶建立覆核案件
      responses:
        '200': {description: 客戶建立已送覆核}
        '400': {description: 輸入或身分證檢核失敗}
        '409': {description: 身分識別資料重複}
  /api/v1/new-contract/code-definitions/{codeGroup}/{codeField}:
    get:
      summary: 查詢新契約領域自己的動態代碼與繁體中文說明
      parameters:
        - {name: codeGroup, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9-]{1,64}$'}}
        - {name: codeField, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9_]{1,64}$'}}
      responses:
        '200': {description: 代碼對照查詢成功；中文及英文說明分欄，職業代碼另含來源分類與版本}
        '400': {description: 群組或欄位格式錯誤}
  /api/v1/new-contract/code-definitions/tables:
    get:
      summary: 查詢目前生效且可供下拉選擇的代碼表
      responses:
        '200': {description: 代碼表清單查詢成功}
  /api/v1/new-contract/applications:
    post:
      summary: 送出保單登打覆核案件
      responses:
        '200': {description: 保單登打已送覆核}
  /api/v1/new-contract/applications/{applicationNo}/initial-premium:
    get:
      summary: 依要保書號碼或正式保單號碼查詢首期應繳
      parameters:
        - {name: applicationNo, in: path, required: true, schema: {type: string, maxLength: 32}}
      responses:
        '200': {description: 查詢成功}
  /api/v1/new-contract/applications/{applicationNo}/policy-number:
    post:
      summary: 查詢案件建立時配置的固定保單號碼
      parameters:
        - {name: applicationNo, in: path, required: true, schema: {type: string, maxLength: 32}}
      responses:
        '200': {description: 保單號碼編發成功}
        '404': {description: 查無要保案件}
  /api/v1/new-contract/applications/query/{query}:
    get:
      summary: 依要保人 ID、被保險人 ID、要保書號碼或正式保單號碼查詢保單資料
      parameters:
        - {name: query, in: path, required: true, schema: {type: string, maxLength: 32}}
      responses:
        '200': {description: 保單資料查詢成功}
        '404': {description: 查無資料}
  /api/v1/new-contract/initial-premium-payments/reconcile:
    post:
      deprecated: true
      summary: 舊版首期保費收款與銷帳路徑
      responses:
        '200': {description: 首期保費資料已送覆核}
  /api/v1/new-contract/remittance-slips:
    post:
      summary: 新增送金單並送交覆核，核准後建立送金單及執行銷帳
      responses:
        '200': {description: 新增送金單已送覆核}
        '400': {description: 送金單欄位或動態代碼無效}
        '409': {description: 同案件已有待審送金單}
  /api/v1/new-contract/remittance-slips/match:
    post:
      deprecated: true
      summary: 舊版首期保費配對路徑
      responses:
        '200': {description: 收款與銷帳完成}
  /api/v1/new-contract/underwriting-batch/requests:
    post:
      summary: 將指定保單與執行日送出新契約批次承保作業覆核案件
      description: 覆核核准後建立 W 等待排程；每日 21:00（Asia/Taipei）只領取要保案件 PW、執行日等於當日且排程狀態 W 的案件。executionDate 不得早於臺北當日。
      responses:
        '200': {description: 新契約批次承保作業已送覆核}
        '400': {description: 執行日早於臺北當日或欄位驗證失敗}
  /api/v1/new-contract/underwriting-batch/executions:
    get:
      summary: 查詢最近新契約批次承保作業執行紀錄
      responses:
        '200': {description: 查詢成功}
  /api/v1/new-contract/underwriting-reviews/{query}:
    get:
      summary: 依要保書號碼或正式保單號碼查詢核保審查案件
      parameters:
        - {name: query, in: path, required: true, schema: {type: string, maxLength: 32}}
      responses:
        '200': {description: 核保審查案件查詢成功}
        '404': {description: 查無核保案件}
  /api/v1/new-contract/underwriting-reviews/decisions:
    post:
      summary: 修改核保結果並送交 Maker-Checker 覆核
      description: 核准後依固定契約更新 DC拒保為NS/13、PO延期為DS/14、CN取消為CS/15，並追加核保決行稽核。
      responses:
        '200': {description: 核保結果修改已送覆核}
        '400': {description: 核保結果或欄位驗證失敗}
        '409': {description: 同案件已有待審異動或版本衝突}
  /api/v1/new-contract/underwriting-inquiries/{query}:
    get:
      summary: 依照會單號、要保書號碼或正式保單號碼查詢核保照會結果
      description: 回傳照會、要保書、必填保單號碼、遮蔽後要保人與被保險人資料、投保資料、核保結果與未通過檢核項目。
      parameters:
        - {name: query, in: path, required: true, schema: {type: string, maxLength: 32}}
      responses:
        '200': {description: 核保照會單查詢成功}
        '404': {description: 查無核保照會單}
  /api/v1/new-contract/underwriting-inquiries/{query}/pdf:
    get:
      summary: 產生核保照會單 PDF
      parameters:
        - {name: query, in: path, required: true, schema: {type: string, maxLength: 32}}
      responses:
        '200': {description: 回傳 Base64 編碼 PDF 文件}
  /api/v1/new-contract/policy-reversals/{policyNo}/preview:
    get:
      summary: 查詢承保撤回影響與確認 token
      parameters:
        - {name: policyNo, in: path, required: true, schema: {type: string, maxLength: 32}}
      responses:
        '200': {description: 查詢成功}
  /api/v1/new-contract/policy-reversals:
    post:
      summary: 送出承保撤回覆核案件
      responses:
        '200': {description: 承保撤回已送覆核}
components:
  schemas:
    ResponseBodyDto:
      type: object
      required: [success, message, errorCode, errorMessage, data]
      properties:
        success: {type: boolean}
        message: {type: [string, "null"]}
        errorCode: {type: [string, "null"]}
        errorMessage: {type: [string, "null"]}
        data: {}
