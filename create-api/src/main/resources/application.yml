spring:
  application.name: create-api
  datasource:
    # Northflank MySQL Addon 以 MYSQL_JDBC_URI 注入完整 JDBC URL；本機 Docker 則沿用 DB_URL。
    # 兩者都未提供時才使用本機開發預設值，正式環境不得使用預設帳密。
    url: ${MYSQL_JDBC_URI:${DB_URL:jdbc:mysql://localhost:3308/new_contract?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
    username: ${MYSQL_USERNAME:${DB_USER:insurance}}
    password: ${MYSQL_PASSWORD:${DB_PASSWORD:insurance-local-only}}
    hikari:
      # 連線池大小可依 Northflank Addon 方案的連線上限調整，避免單一服務耗盡資料庫連線。
      maximum-pool-size: ${DB_POOL_MAX_SIZE:8}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1700000}
  flyway:
    enabled: true
    # 可用 DB_MIGRATION_URL 指定管理連線；未指定時依序沿用 Addon、本機 DB_URL 與開發預設值。
    url: ${DB_MIGRATION_URL:${MYSQL_JDBC_URI:${DB_URL:jdbc:mysql://localhost:3308/new_contract?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}}
    user: ${DB_MIGRATION_USER:${MYSQL_USERNAME:${DB_USER:insurance}}}
    password: ${DB_MIGRATION_PASSWORD:${MYSQL_PASSWORD:${DB_PASSWORD:insurance-local-only}}}
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration.map-underscore-to-camel-case: true
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
server.port: ${SERVER_PORT:${PORT:8080}}
app.pii-encryption-key: ${PII_ENCRYPTION_KEY}
sso:
  mode: ${AUTH_MODE:demo}
  issuer: ${SSO_ISSUER:http://192.168.1.104:8083}
  jwk-set-uri: ${SSO_JWK_SET_URI:http://localhost:8083/.well-known/jwks.json}
  audience: ${SSO_AUDIENCE:NEW_CONTRACT}
