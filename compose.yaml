services:
  mysql:
    image: mysql:8.4.9
    environment:
      MYSQL_DATABASE: new_contract
      MYSQL_USER: insurance
      MYSQL_PASSWORD: insurance-local-only
      MYSQL_ROOT_PASSWORD: root-local-only
    ports: ["${MYSQL_PORT:-3308}:3306"]
    volumes:
      - insurance-mysql:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot-local-only"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./create-api
    environment:
      DB_URL: jdbc:mysql://a5f8451aa850accf:4c63d482d844aa634334776c76e718@primary.a-linlin--kkj9gmg9xdcp.addon.code.run:3306/c9bac2668501
      DB_USER: a5f8451aa850accf 
      DB_PASSWORD: 4c63d482d844aa634334776c76e718
      DB_MIGRATION_USER: root
      DB_MIGRATION_PASSWORD: root-local-only
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY}
    ports: ["${API_PORT:-8082}:8080"]
    depends_on:
      mysql: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
  web:
    build: ./create-web
    ports: ["5173:80"]
    depends_on:
      api: {condition: service_healthy}
  batch:
    build: ./create-batch
    profiles: ["batch"]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/new_contract?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: insurance
      DB_PASSWORD: insurance-local-only
    depends_on:
      mysql: {condition: service_healthy}
volumes:
  insurance-mysql:
